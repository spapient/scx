name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Evaluator selftest (Unix)
        if: runner.os != 'Windows'
        run: ./bin/scx-eval selftest
      - name: Evaluator selftest (Windows)
        if: runner.os == 'Windows'
        run: python bin/scx-eval selftest
      - name: Bench (compress 50k lines)
        run: cargo run --release --locked --example bench
      - name: Bench gate (10k memory recall)
        if: runner.os == 'Linux'
        run: cargo run --release --locked --example bench -- memory
      - name: CLI smoke (Unix)
        if: runner.os != 'Windows'
        run: sh bin/run --version
      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: bin\run.cmd --version

  quality:
    # Rebuild the confirm5 corpus from the tracked incident JSON, then enforce
    # the mechanical, human, AI, and policy evidence boundaries plus the
    # pre-registered advantage rule.
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Build release
        run: cargo build --release --locked
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Tool selftest
        run: python bin/scx-eval selftest
      - name: Rebuild confirm5 corpus
        run: >-
          python bin/scx-eval seed eval/confirm5.corpus.json
          --mem-dir eval/ci-mem --csv eval/ci-cases.csv
          --binary target/release/scx.exe --force
      - name: Build mechanical baseline
        run: >-
          python bin/scx-eval baseline
          --csv eval/ci-cases.csv --out eval/ci-baseline.json
          --judge-by mechanical-target-confirm5-v1
          --judge-date 2026-10-23T00:00:00Z
      - name: Confirm5 mechanical gate and verbose replay
        shell: pwsh
        run: |
          .\target\release\scx.exe --eval .\eval\ci-baseline.json --gate --eval-verbose --mem-dir .\eval\ci-mem 1> .\eval\ci-verbose.txt 2> .\eval\ci-verbose.err
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\eval\ci-verbose.txt -Tail 40
            Get-Content .\eval\ci-verbose.err -Tail 40
            throw "confirm5 gate failed with exit $LASTEXITCODE"
          }
      - name: Reject policy labels as human closure
        shell: pwsh
        run: |
          .\target\release\scx.exe --eval .\eval\confirm5-policy.labels.json --gate-human --mem-dir .\eval\ci-mem 1> .\eval\ci-policy-gate.txt 2> $null
          if ($LASTEXITCODE -ne 2) {
            Get-Content .\eval\ci-policy-gate.txt -Tail 40
            throw "policy labels must not pass --gate-human (exit $LASTEXITCODE)"
          }
          $global:LASTEXITCODE = 0
      - name: Frozen blind packet
        run: >-
          python bin/scx-eval verify
          --packet eval/confirm5-40.packet.tsv
          --sha256 b8eebf2fcb78d0fb745c9760b55dd34d832a9bb976b377f3dfb8c7cea264093f
      - name: AI labels pass items gate, fail human gate
        shell: pwsh
        run: |
          .\target\release\scx.exe --eval .\eval\confirm5-ai.labels.json --gate-items --mem-dir .\eval\ci-mem 1> .\eval\ci-ai-items.txt 2> $null
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\eval\ci-ai-items.txt -Tail 30
            throw "AI per-item gate failed with exit $LASTEXITCODE"
          }
          if ((Get-Content .\eval\ci-ai-items.txt -Raw) -notmatch 'non-human \(evidence: per-item AI') {
            throw "AI gate must declare non-human adjudication"
          }
          .\target\release\scx.exe --eval .\eval\confirm5-ai.labels.json --gate-human --mem-dir .\eval\ci-mem 1> $null 2> $null
          if ($LASTEXITCODE -ne 2) { throw "AI labels must not pass --gate-human (exit $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
      - name: Human per-item gate
        shell: pwsh
        run: |
          .\target\release\scx.exe --eval .\eval\confirm5-hao.labels.json --gate-human --mem-dir .\eval\ci-mem 1> .\eval\ci-hao-gate.txt 2> $null
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\eval\ci-hao-gate.txt -Tail 40
            throw "human per-item gate failed with exit $LASTEXITCODE"
          }
          if ((Get-Content .\eval\ci-hao-gate.txt -Raw) -notmatch 'gate: PASS') {
            throw "human per-item gate did not print PASS"
          }
      - name: Confirm5 paired statistics
        run: >-
          python bin/scx-eval stats
          --baseline eval/ci-baseline.json
          --verbose eval/ci-verbose.txt
          --mem-dir eval/ci-mem
          --out eval/ci-stats.csv
          --cluster-size 5
          --boot 10000 --perm 10000 --mde 0.05 --seed 20261023
      - name: Enforce pre-registered advantage
        shell: pwsh
        run: |
          $rows = @(Import-Csv .\eval\ci-stats.csv)
          $hard = @($rows | Where-Object { $_.group -eq 'tier:hard' })
          if ($hard.Count -ne 1) { throw "confirm5 hard result missing" }
          if ([double]$hard[0].delta -lt 0.05 -or [double]$hard[0].ci_lo -le 0 -or [double]$hard[0].perm_p -ge 0.05) {
            $hard | Format-List | Out-String | Write-Host
            throw "confirm5 quality advantage not established"
          }
          $cluster = @($rows | Where-Object { $_.group -eq 'tier:hard:cluster' })
          if ($cluster.Count -ne 1 -or [double]$cluster[0].ci_lo -le 0) {
            throw "confirm5 cluster sensitivity failed"
          }

  msrv:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.82.0
      - name: Check declared MSRV
        run: cargo check --locked --all-targets
