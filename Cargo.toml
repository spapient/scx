[package]
name = "scx"
version = "0.11.0"
edition = "2021"
rust-version = "1.82"
default-run = "scx"
license = "MIT OR Apache-2.0"
description = "Local query-aware evidence-selection compressor for agent contexts (seed-region gated optional layer, structural seed invariant, deterministic, offline, zero deps)"
repository = "https://github.com/spapient/scx"
homepage = "https://github.com/spapient/scx"
keywords = ["logs", "compression", "context", "rag", "offline"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# 发布包白名单：仅含已跟踪文件（gitignore 风格，! 排除）。config 当前约 3.4MB，
# 统一资产包随测试与评测入口分发；仅排除 CI 生成物、记忆库与其他本地产物。
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "SKILL.md",
    "src/**",
    "docs/**",
    "!docs/comparison-v051.md",
    "tests/**",
    "config/pipeline.json",
    "config/semantic.json",
    "config/evaluation.json",
]

[dependencies]

[features]
default = ["memory"]
# 可选语义增强打分器（手写 std 点积/sigmoid + 自描述权重文件，零第三方 crate；
# 关闭时模块 cfg 排除，默认路径与 v0.4.1 逐字节一致）。
semantic = []
# 本地记忆库/证据存储（默认启用；`--no-default-features` 构建最小内核，
# 压缩路径不依赖 memory，脱敏降级为无 Secret 模式）。
memory = []
# 诊断计时（可选）：压缩主链分阶段耗时打印到 stderr；关闭时零代码零开销，
# 输出与默认构建逐字节一致。仅用于性能定位，不参与任何结果路径。
perf = []
# 开发/CI 工具（scx-tooling 二进制与 tests/tooling.rs）；不进发布路径。
eval = ["memory", "semantic"]

[[bin]]
name = "scx"
path = "src/main.rs"

[[bin]]
name = "scx-tooling"
path = "src/tooling/mod.rs"
required-features = ["eval"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 1
