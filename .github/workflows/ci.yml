name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path rs/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rs/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path rs/Cargo.toml --locked
      - name: Release build
        run: cargo build --manifest-path rs/Cargo.toml --release --locked
      - name: Bench (compress 50k lines)
        run: cargo run --manifest-path rs/Cargo.toml --release --locked --example bench
      - name: CLI smoke (Unix)
        if: runner.os != 'Windows'
        run: sh bin/run --version
      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: bin\run.cmd --version

  quality:
    # Frozen confirm5 regression: rebuild the corpus from its incident source,
    # then fail if the pre-registered hard-query advantage disappears.
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Build release
        run: cargo build --manifest-path rs/Cargo.toml --release --locked
      - name: Rebuild confirm5 corpus
        shell: pwsh
        run: ./eval-real/seed-confirm5.ps1 -Force -MemDir .\eval-real\confirm5-ci-mem -Csv .\eval-real\confirm5-ci-cases.csv
      - name: Build confirm5 CI baseline
        shell: pwsh
        run: ./scripts/holdout-build.ps1 -Csv .\eval-real\confirm5-ci-cases.csv -Out .\eval-real\confirm5-ci-baseline.json -JudgeBy mechanical-target-confirm5-v1 -JudgeDate 2026-10-23T00:00:00Z
      - name: Run confirm5 gate
        shell: pwsh
        run: |
          .\rs\target\release\scx.exe --eval .\eval-real\confirm5-ci-baseline.json --gate --eval-verbose --mem-dir .\eval-real\confirm5-ci-mem 1> .\eval-real\confirm5-ci.txt 2> .\eval-real\confirm5-ci.err
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\eval-real\confirm5-ci.txt -Tail 40
            Get-Content .\eval-real\confirm5-ci.err -Tail 40
            throw "confirm5 gate failed with exit $LASTEXITCODE"
          }
      - name: Reject policy labels as human closure
        shell: pwsh
        run: |
          .\rs\target\release\scx.exe --eval .\eval-real\confirm5-baseline-human.json --gate-human --mem-dir .\eval-real\confirm5-ci-mem 1> .\eval-real\confirm5-policy-human-gate.txt 2> .\eval-real\confirm5-policy-human-gate.err
          if ($LASTEXITCODE -ne 2) {
            Get-Content .\eval-real\confirm5-policy-human-gate.txt -Tail 40
            throw "policy-materialized labels must not pass --gate-human (exit $LASTEXITCODE)"
          }
          $global:LASTEXITCODE = 0
      - name: Rebuild real-incident corpus
        shell: pwsh
        run: ./eval-real/seed-real.ps1 -Force -MemDir .\eval-real\real-ci-mem -Csv .\eval-real\real-ci-cases.csv
      - name: Frozen per-item blind packet
        shell: pwsh
        run: |
          $want = 'b8eebf2fcb78d0fb745c9760b55dd34d832a9bb976b377f3dfb8c7cea264093f'
          $got = (Get-FileHash .\eval-real\confirm5-blind40-packet.tsv -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "blind packet drifted: $got" }
      - name: AI per-item gate passes, human gate still rejects
        shell: pwsh
        run: |
          .\rs\target\release\scx.exe --eval .\eval-real\confirm5-blind40-ai.json --gate-items --mem-dir .\eval-real\confirm5-ci-mem 1> .\eval-real\ai-items-gate.txt 2> $null
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\eval-real\ai-items-gate.txt -Tail 30
            throw "AI per-item gate failed with exit $LASTEXITCODE"
          }
          if ((Get-Content .\eval-real\ai-items-gate.txt -Raw) -notmatch 'non-human \(evidence: per-item AI') {
            throw "AI gate must declare non-human adjudication"
          }
          .\rs\target\release\scx.exe --eval .\eval-real\confirm5-blind40-ai.json --gate-human --mem-dir .\eval-real\confirm5-ci-mem 1> $null 2> $null
          if ($LASTEXITCODE -ne 2) { throw "AI labels must not pass --gate-human (exit $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
      - name: Case-level signoff must fail per-item gate (real incidents)
        shell: pwsh
        run: |
          .\rs\target\release\scx.exe --eval .\eval-real\real-baseline-arb.json --gate-human --mem-dir .\eval-real\real-ci-mem 1> .\eval-real\real-ci-gate.txt 2> .\eval-real\real-ci-gate.err
          if ($LASTEXITCODE -ne 2) {
            Get-Content .\eval-real\real-ci-gate.txt -Tail 40
            Get-Content .\eval-real\real-ci-gate.err -Tail 40
            throw "case-level signoff must not pass per-item gate (exit $LASTEXITCODE)"
          }
          if ((Get-Content .\eval-real\real-ci-gate.txt -Raw) -notmatch 'human per-item provenance items=0/\d+') {
            throw "missing per-item provenance failure line"
          }
          $global:LASTEXITCODE = 0
      - name: Case-level signoff must fail per-item gate (baseline-final)
        shell: pwsh
        run: |
          .\rs\target\release\scx.exe --eval .\eval-real\baseline-final.json --gate-human --mem-dir .\eval-real\mem 1> .\eval-real\baseline-human-gate.txt 2> .\eval-real\baseline-human-gate.err
          if ($LASTEXITCODE -ne 2) {
            Get-Content .\eval-real\baseline-human-gate.txt -Tail 40
            Get-Content .\eval-real\baseline-human-gate.err -Tail 40
            throw "baseline-final case-level signoff must fail per-item gate (exit $LASTEXITCODE)"
          }
          if ((Get-Content .\eval-real\baseline-human-gate.txt -Raw) -notmatch 'human per-item provenance items=0/116') {
            throw "missing per-item provenance failure line"
          }
          $global:LASTEXITCODE = 0
      - name: Compute confirm5 statistics
        shell: pwsh
        run: |
          ./eval-real/v2-rank-diff.ps1 -Verbose .\eval-real\confirm5-ci.txt -Baseline .\eval-real\confirm5-ci-baseline.json -Out .\eval-real\confirm5-ci-rank.csv
          ./eval-real/v2-strata.ps1 -Baseline .\eval-real\confirm5-ci-baseline.json -MemDir .\eval-real\confirm5-ci-mem -Verbose .\eval-real\confirm5-ci.txt -Out .\eval-real\confirm5-ci-strata.csv
          ./eval-real/v2-significance.ps1 -RankDiff .\eval-real\confirm5-ci-rank.csv -Strata .\eval-real\confirm5-ci-strata.csv -Out .\eval-real\confirm5-ci-significance.csv -Boot 10000 -Perm 10000 -Mde 0.05 -Seed 20261023
          ./eval-real/cluster-significance.ps1 -RankDiff .\eval-real\confirm5-ci-rank.csv -Strata .\eval-real\confirm5-ci-strata.csv -Out .\eval-real\confirm5-ci-significance-cluster.csv -Boot 10000 -Perm 10000 -Mde 0.05 -Seed 20261023
          $hard = @(Import-Csv .\eval-real\confirm5-ci-significance.csv | Where-Object { $_.group -eq 'tier:hard' })
          if ($hard.Count -ne 1) { throw "confirm5 hard result missing" }
          if ([double]$hard[0].delta -lt 0.05 -or [double]$hard[0].ci_lo -le 0 -or [double]$hard[0].perm_p -ge 0.05) {
            $hard | Format-List | Out-String | Write-Host
            throw "confirm5 quality advantage not established"
          }
          $cluster = @(Import-Csv .\eval-real\confirm5-ci-significance-cluster.csv)
          if ($cluster.Count -ne 1 -or [double]$cluster[0].ci_lo -le 0) {
            throw "confirm5 cluster sensitivity failed"
          }
