[package]
name = "scx"
version = "0.11.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Local query-aware evidence-selection compressor for agent contexts (seed-region gated optional layer, structural seed invariant, deterministic, offline, zero deps)"
repository = "https://github.com/spapient/scx"
homepage = "https://github.com/spapient/scx"
keywords = ["logs", "compression", "context", "rag", "offline"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# 发布包白名单：仅含已跟踪文件（gitignore 风格，! 排除）。排除 config/bench
# 评测语料/结果（≈47MB，超 crates.io 10MiB 上限）与未跟踪/被 gitignore 的
# 本地产物（ci-* 统计、ci-mem 记忆库、__pycache__、本地草稿）——cargo 会把
# 「被 include 匹配但未提交」的文件视为脏并拒绝发布，必须逐项排除。
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "SKILL.md",
    "src/**",
    "docs/**",
    "!docs/comparison-v051.md",
    "tools/**",
    "!tools/__pycache__/**",
    "examples/**",
    "tests/**",
    "config/**",
    "!config/bench/**",
    "!config/ci-*",
    "!config/*-mem/**",
    "!config/*-mem-*/**",
    "!config/tmp-*/**",
    "!config/*-ablate/**",
    "!config/*-replay/**",
]

[dependencies]

[features]
default = ["memory"]
# 可选语义增强打分器（手写 std 点积/sigmoid + 自描述权重文件，零第三方 crate；
# 关闭时模块 cfg 排除，默认路径与 v0.4.1 逐字节一致）。
semantic = []
# 本地记忆库/证据存储（默认启用；`--no-default-features` 构建最小内核，
# 压缩路径不依赖 memory，脱敏降级为无 Secret 模式）。
memory = []
# 诊断计时（可选）：压缩主链分阶段耗时打印到 stderr；关闭时零代码零开销，
# 输出与默认构建逐字节一致。仅用于性能定位，不参与任何结果路径。
perf = []

[[example]]
name = "minhash_mrr"
# 纯 memory 召回演示：无 memory feature 时跳过编译（Cargo 官方机制）。
required-features = ["memory"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 1
